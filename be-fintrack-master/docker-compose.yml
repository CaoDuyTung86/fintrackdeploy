version: '3.8'

services:
  backend:
    build: .
    container_name: be-fintrack
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=fintrack_db;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ProudOfYou12!
    networks:
    - fintrack-network
    restart: always

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "ProudOfYou12!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - fintrack-network
    restart: always
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P ProudOfYou12! -Q \"SELECT 1\""
      ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  fintrack-network:
    driver: bridge


